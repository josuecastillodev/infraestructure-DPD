services:
  landing:
    image: ghcr.io/josuecastillodev/pinzon-landing:latest
    restart: unless-stopped
    mem_limit: 64m
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      # Landing Astro estática servida por nginx (puerto 80 en el contenedor)
      - traefik.http.services.pinzon-landing.loadbalancer.server.port=80
      # Landing (apex + www)
      - traefik.http.routers.pinzon-landing.rule=Host(`pinzontravel.com`) || Host(`www.pinzontravel.com`)
      - traefik.http.routers.pinzon-landing.priority=100
      - traefik.http.routers.pinzon-landing.entrypoints=websecure
      - traefik.http.routers.pinzon-landing.tls.certresolver=letsencrypt-dns
      - traefik.http.routers.pinzon-landing.service=pinzon-landing

  web:
    image: ghcr.io/josuecastillodev/pinzon-web:v0.1.0
    restart: unless-stopped
    mem_limit: 64m
    depends_on:
      api:
        condition: service_started
    networks:
      - proxy
      - internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      # SPA React/Vite servida por nginx (puerto 80 en el contenedor)
      - traefik.http.services.pinzon-web.loadbalancer.server.port=80
      # App
      - traefik.http.routers.pinzon-app.rule=Host(`app.pinzontravel.com`)
      - traefik.http.routers.pinzon-app.priority=50
      - traefik.http.routers.pinzon-app.entrypoints=websecure
      - traefik.http.routers.pinzon-app.tls.certresolver=letsencrypt-dns
      - traefik.http.routers.pinzon-app.service=pinzon-web
      # Tenants catch-all: matchea también app. y api., por eso su prioridad es la más baja.
      # Este router declara el certificado wildcard (DNS-01).
      - traefik.http.routers.pinzon-tenants.rule=HostRegexp(`^[a-z0-9-]+\.pinzontravel\.com$$`)
      - traefik.http.routers.pinzon-tenants.priority=1
      - traefik.http.routers.pinzon-tenants.entrypoints=websecure
      - traefik.http.routers.pinzon-tenants.tls.certresolver=letsencrypt-dns
      - traefik.http.routers.pinzon-tenants.tls.domains[0].main=pinzontravel.com
      - traefik.http.routers.pinzon-tenants.tls.domains[0].sans=*.pinzontravel.com
      - traefik.http.routers.pinzon-tenants.service=pinzon-web

  api:
    image: ghcr.io/josuecastillodev/pinzon-api:v0.1.0
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_OPTIONS: --max-old-space-size=256
    mem_limit: 384m
    # El entrypoint de la imagen ejecuta `prisma migrate deploy` al arrancar
    # (y el seed si SEED_ON_START=true), por eso exige db healthy.
    depends_on:
      db:
        condition: service_healthy
    networks:
      - proxy
      - internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.services.pinzon-api.loadbalancer.server.port=3000
      - traefik.http.routers.pinzon-api.rule=Host(`api.pinzontravel.com`)
      - traefik.http.routers.pinzon-api.priority=50
      - traefik.http.routers.pinzon-api.entrypoints=websecure
      - traefik.http.routers.pinzon-api.tls.certresolver=letsencrypt-dns
      - traefik.http.routers.pinzon-api.service=pinzon-api

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    command: postgres -c shared_buffers=128MB -c max_connections=50
    env_file:
      - .env
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

volumes:
  db-data:

networks:
  proxy:
    external: true
  internal:
