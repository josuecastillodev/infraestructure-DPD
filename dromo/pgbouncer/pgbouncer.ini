[databases]
* = host=db port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
auth_user = pgbouncer_authenticator
auth_query = SELECT * FROM public.pgbouncer_auth_query($1)
auth_dbname = route_control
pool_mode = transaction
; Dimensionado para el VPS (postgres corre con max_connections=50):
; max_db_connections limita conexiones por DB backend; default_pool_size por
; par (user, db). Con DB-por-tenant, pools pequeños evitan agotar el cluster.
max_client_conn = 1000
default_pool_size = 5
reserve_pool_size = 2
reserve_pool_timeout = 5
max_db_connections = 20
server_idle_timeout = 600
log_connections = 0
log_disconnections = 0
stats_period = 60
admin_users = postgres,route_provisioner
ignore_startup_parameters = extra_float_digits,search_path
