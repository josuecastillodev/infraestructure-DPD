services:
  web:
    image: ghcr.io/josuecastillodev/dromo-web:v0.1.0
    restart: unless-stopped
    mem_limit: 64m
    depends_on:
      api:
        condition: service_started
    networks:
      - proxy
      - internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      # SPA React/Vite servida por nginx (puerto 80 en el contenedor)
      - traefik.http.services.dromo-web.loadbalancer.server.port=80
      # Middlewares de PRE-LANZAMIENTO (quitar al lanzar; ver README, sección "Lanzamiento de dromo"):
      # (a) basic auth — el valor viene de DROMO_BASIC_AUTH en .env (generar con htpasswd)
      # (b) noindex — evita indexación por buscadores antes del lanzamiento
      - traefik.http.middlewares.dromo-auth.basicauth.users=${DROMO_BASIC_AUTH}
      - traefik.http.middlewares.dromo-noindex.headers.customresponseheaders.X-Robots-Tag=noindex, nofollow
      # Landing (apex + www)
      - traefik.http.routers.dromo-landing.rule=Host(`${DROMO_DOMAIN}`) || Host(`www.${DROMO_DOMAIN}`)
      - traefik.http.routers.dromo-landing.priority=100
      - traefik.http.routers.dromo-landing.entrypoints=websecure
      - traefik.http.routers.dromo-landing.tls.certresolver=letsencrypt-dns
      - traefik.http.routers.dromo-landing.middlewares=dromo-auth,dromo-noindex
      - traefik.http.routers.dromo-landing.service=dromo-web
      # App
      - traefik.http.routers.dromo-app.rule=Host(`app.${DROMO_DOMAIN}`)
      - traefik.http.routers.dromo-app.priority=50
      - traefik.http.routers.dromo-app.entrypoints=websecure
      - traefik.http.routers.dromo-app.tls.certresolver=letsencrypt-dns
      - traefik.http.routers.dromo-app.middlewares=dromo-auth,dromo-noindex
      - traefik.http.routers.dromo-app.service=dromo-web
      # Tenants catch-all: matchea también app., api. y admin., por eso su prioridad es la más baja.
      # Este router declara el certificado wildcard (DNS-01).
      - traefik.http.routers.dromo-tenants.rule=HostRegexp(`^[a-z0-9-]+\.${DROMO_DOMAIN}$$`)
      - traefik.http.routers.dromo-tenants.priority=1
      - traefik.http.routers.dromo-tenants.entrypoints=websecure
      - traefik.http.routers.dromo-tenants.tls.certresolver=letsencrypt-dns
      - traefik.http.routers.dromo-tenants.tls.domains[0].main=${DROMO_DOMAIN}
      - traefik.http.routers.dromo-tenants.tls.domains[0].sans=*.${DROMO_DOMAIN}
      - traefik.http.routers.dromo-tenants.middlewares=dromo-auth,dromo-noindex
      - traefik.http.routers.dromo-tenants.service=dromo-web

  admin:
    image: ghcr.io/josuecastillodev/dromo-admin:v0.1.0
    restart: unless-stopped
    mem_limit: 64m
    depends_on:
      api:
        condition: service_started
    networks:
      - proxy
      - internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.services.dromo-admin.loadbalancer.server.port=80
      - traefik.http.routers.dromo-admin.rule=Host(`admin.${DROMO_DOMAIN}`)
      - traefik.http.routers.dromo-admin.priority=50
      - traefik.http.routers.dromo-admin.entrypoints=websecure
      - traefik.http.routers.dromo-admin.tls.certresolver=letsencrypt-dns
      - traefik.http.routers.dromo-admin.middlewares=dromo-auth,dromo-noindex
      - traefik.http.routers.dromo-admin.service=dromo-admin

  api:
    image: ghcr.io/josuecastillodev/dromo-api:v0.1.0
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_OPTIONS: --max-old-space-size=256
    mem_limit: 384m
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - proxy
      - internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.services.dromo-api.loadbalancer.server.port=3000
      - traefik.http.routers.dromo-api.rule=Host(`api.${DROMO_DOMAIN}`)
      - traefik.http.routers.dromo-api.priority=50
      - traefik.http.routers.dromo-api.entrypoints=websecure
      - traefik.http.routers.dromo-api.tls.certresolver=letsencrypt-dns
      - traefik.http.routers.dromo-api.middlewares=dromo-auth,dromo-noindex
      - traefik.http.routers.dromo-api.service=dromo-api

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    command: postgres -c shared_buffers=128MB -c max_connections=50
    env_file:
      - .env
    volumes:
      - db-data:/var/lib/postgresql/data
      # Bootstrap de primer arranque: crea route_control, route_provisioner y
      # el usuario/función de auth_query de PgBouncer (solo corre con el volumen vacío)
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  pgbouncer:
    # auth_query mode: no se definen DB_USER/DB_PASSWORD; la auth la resuelve la
    # función SECURITY DEFINER pgbouncer_auth_query creada por postgres/init.sh.
    # userlist.txt se genera en el servidor (ver README) y NO se versiona.
    image: edoburu/pgbouncer:v1.23.1-p3
    restart: unless-stopped
    environment:
      DB_HOST: db
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # noeviction: Redis respalda colas BullMQ; con lru se perderían jobs.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

volumes:
  db-data:
  redis-data:

networks:
  proxy:
    external: true
  internal:
