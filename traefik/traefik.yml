# Configuración estática de Traefik v3
# Este archivo se monta read-only en el contenedor (ver docker-compose.yml).

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

providers:
  docker:
    exposedByDefault: false
    network: proxy

certificatesResolvers:
  # HTTP-01: para landings con dominio simple (dizaru)
  letsencrypt:
    acme:
      email: josue.castpon@gmail.com
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web

  # DNS-01 (Cloudflare): para wildcards de las plataformas (pinzon, dromo).
  # Squarespace (registrador actual) no tiene API de DNS, así que los dominios
  # de plataformas delegan sus nameservers a Cloudflare (plan free) y el reto
  # DNS-01 se resuelve ahí. Requiere CF_DNS_API_TOKEN en el .env.
  letsencrypt-dns:
    acme:
      email: josue.castpon@gmail.com
      storage: /letsencrypt/acme-dns.json
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"

  # DNS-01 (DuckDNS): para la demo de dromo sin dominio propio
  # (*.xxx.duckdns.org). Requiere DUCKDNS_TOKEN en el .env. Al comprar el
  # dominio real de dromo, este resolver deja de usarse (no hace falta borrarlo).
  letsencrypt-duckdns:
    acme:
      email: josue.castpon@gmail.com
      storage: /letsencrypt/acme-duckdns.json
      dnsChallenge:
        provider: duckdns
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"
